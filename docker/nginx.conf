# nginx for the portfolio container: serves the prebuilt site like Netlify does (/about →
# about.html), with the site's security headers and long caching for the hashed build files.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The site's security headers (generated from the build's _headers file)
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Netlify's own config file is not part of the site
  location = /_headers {
    return 404;
  }

  # Built files carry a content hash in their name: cache them for a year
  location /_nuxt/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Pages: /about serves about.html, like Netlify's pretty URLs
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
